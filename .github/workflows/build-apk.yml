name: Build XiaoRuiAssistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"
      - ".github/actions/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source is uploaded
        run: |
          test -f gradlew || { echo "::error::Upload the full modified Eta source to repository root first"; exit 1; }
          test -d app || { echo "::error::Missing app directory"; exit 1; }
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify modes, home UI and independent app routing
        run: >-
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
          --tests 'io.github.mangi.eta.agent.runtime.EntrySurfaceGuardTest'
          --tests 'io.github.mangi.eta.core.ModuleConfigEntryPackagesTest'
          --tests 'io.github.mangi.eta.hook.system.AccessibilityServiceEnforcerTest'
          --tests 'io.github.mangi.eta.agent.roleplay.ConversationModePreferenceTest'
          --tests 'io.github.mangi.eta.ui.screens.home.AgentHomeModeUiTest'
          --tests 'io.github.mangi.eta.agent.runtime.AgentRuntimeBindingTest'
          --tests 'io.github.mangi.eta.ui.model.AppModuleTest'
          --tests 'io.github.mangi.eta.ui.screens.characters.RoleplayModuleUiTest'
          --tests 'io.github.mangi.eta.ui.navigation.AgentNavigationRestorationTest'
          --tests 'io.github.mangi.eta.ui.app.AgentWorkspaceModuleTest'
      - name: Upload test reports and mode screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XiaoRuiAssistant-mode-ui-verification
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/mode-ui/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoRuiAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
