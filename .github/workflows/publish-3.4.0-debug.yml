name: Publish verified 3.4.0 Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-3.4.0-debug.yml"

permissions: {}

concurrency:
  group: publish-3.4.0-debug
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zxr1154/XiaoRuiAssistant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 3.4.0-debug
      SOURCE_SHA: d56581bad0d22549b5525749126de75c2b3d5bcc
      BUILD_RUN: "40150186181"
      ARTIFACT_ID: "12581909474"
      APK_NAME: XiaoRuiAssistant-v3.4.0-debug.apk
      APK_SHA256: 5dbc5a7ef9972f3ddc3b839e472a4b2f6902badae844fde2f9c3dd6ba546f124
      ZIP_SHA256: ec0d08be8b3c9061be77fcf242d23959d744451ef3140d41089b02471095c4ca
      CHECKSUM_NAME: XiaoRuiAssistant-v3.4.0-SHA256SUMS.txt
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify original build and download the existing APK
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          jq -e --arg sha "$SOURCE_SHA" --argjson run "$BUILD_RUN" \
            '.name == "XiaoRuiAssistant-debug-apk" and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha' \
            "$RUNNER_TEMP/artifact.json"
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/original-apk.zip"
          printf '%s  %s\n' "$ZIP_SHA256" "$RUNNER_TEMP/original-apk.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/release-files"
          export RELEASE_DIR="$RUNNER_TEMP/release-files"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "original-apk.zip") as archive:
              apks = [item for item in archive.infolist() if item.filename.endswith(".apk")]
              assert len(apks) == 1, "Expected exactly one APK"
              assert Path(apks[0].filename).name == os.environ["APK_NAME"], "Unexpected APK name"
              (Path(os.environ["RELEASE_DIR"]) / os.environ["APK_NAME"]).write_bytes(archive.read(apks[0]))
          PY
          cd "$RELEASE_DIR"
          test "$(stat --format='%s' "$APK_NAME")" = 86308304
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$CHECKSUM_NAME"
          sha256sum --check --strict "$CHECKSUM_NAME"

      - name: Create draft and upload verified release assets
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          小瑞的助手 3.4.0 Debug APK，基于完整 Android 修改版源码构建。

          - 首页分为「智能助手」和「角色扮演」独立模块；智能助手保留普通／破甲切换。
          - 角色扮演独立角色库、故事记录与聊天入口，返回智能助手可恢复原会话。
          - 保留独立 applicationId 与 Agent Runtime 绑定修复；固定 Debug 签名。

          Android 13 及以上，ARM64。版本：3.4.0-debug（2026102501）。这是 Debug 测试版。

          源提交：d56581bad0d22549b5525749126de75c2b3d5bcc
          构建与验证：[GitHub Actions #40150186181](https://github.com/zxr1154/XiaoRuiAssistant/actions/runs/40150186181)，51 项测试通过。

          APK SHA-256：5dbc5a7ef9972f3ddc3b839e472a4b2f6902badae844fde2f9c3dd6ba546f124

          从旧版 3.3.4 升级时，若系统提示签名不一致，请先导出数据备份再卸载旧版并安装此版。
          NOTES
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if ! jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' "$RUNNER_TEMP/releases.json" >/dev/null; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$SOURCE_SHA" \
              --title "小瑞的助手 3.4.0 (Debug)" --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease --draft
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASE_ID="$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' "$RUNNER_TEMP/releases.json")"
          test -n "$RELEASE_ID"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e --arg sha "$SOURCE_SHA" '.target_commitish == $sha' "$RUNNER_TEMP/release.json"
          for asset in "$APK_NAME" "$CHECKSUM_NAME"; do
            file="$RUNNER_TEMP/release-files/$asset"
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size="$(stat --format='%s' "$file")"
            if jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/release.json" >/dev/null; then
              jq -e --arg name "$asset" --arg digest "$digest" --argjson size "$size" \
                'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $digest and .size == $size)' \
                "$RUNNER_TEMP/release.json"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GH_REPO"
            fi
          done

      - name: Verify uploaded assets, publish, and verify download
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e --arg name "$APK_NAME" --arg digest "sha256:$APK_SHA256" \
            'any(.assets[]; .name == $name and .state == "uploaded" and .digest == $digest and .size == 86308304)' \
            "$RUNNER_TEMP/release.json"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --prerelease
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/download-verified"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "$APK_NAME" --pattern "$CHECKSUM_NAME" \
            --dir "$RUNNER_TEMP/download-verified"
          cd "$RUNNER_TEMP/download-verified"
          sha256sum --check --strict "$CHECKSUM_NAME"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e '.draft == false and .prerelease == true and .published_at != null' "$RUNNER_TEMP/release.json"
          {
            printf '## Published 3.4.0 Debug APK\n\n'
            jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | "[Download APK](\(.browser_download_url))\n\nSHA-256: \(.digest)\n\nBytes: \(.size)"' "$RUNNER_TEMP/release.json"
            printf '\n\nUploaded asset and downloaded file both match the verified original build.\n'
          } >> "$GITHUB_STEP_SUMMARY"
